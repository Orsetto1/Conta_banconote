<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conta Banconote — L'Orsetto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDE8DA;
    --bg-alt: #E3DDC9;
    --surface: #FBFAF5;
    --surface-2: #F3F0E4;
    --ink: #1E2A22;
    --ink-soft: #5B6459;
    --line: #CFC8B2;
    --accent: #2F6F4E;
    --accent-soft: #DCE8DE;
    --danger: #A6412C;
    --danger-soft: #F2DFD8;
    --ok: #2F6F4E;
    --ok-soft: #DCE8DE;
    --amber: #9A6B15;
    --amber-soft: #F2E7CF;
    --radius: 14px;
    --font-ui: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-num: "Space Mono", "SF Mono", ui-monospace, Menlo, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171B17; --bg-alt: #1F241E; --surface: #20261F; --surface-2: #262C24;
      --ink: #EDEAE0; --ink-soft: #A3ac9d; --line: #3A4137;
      --accent: #6FBE93; --accent-soft: #26352C;
      --danger: #E28169; --danger-soft: #3A2620;
      --ok: #6FBE93; --ok-soft: #26352C;
      --amber: #E0BB63; --amber-soft: #362D1A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171B17; --bg-alt: #1F241E; --surface: #20261F; --surface-2: #262C24;
    --ink: #EDEAE0; --ink-soft: #A3ac9d; --line: #3A4137;
    --accent: #6FBE93; --accent-soft: #26352C;
    --danger: #E28169; --danger-soft: #3A2620;
    --ok: #6FBE93; --ok-soft: #26352C;
    --amber: #E0BB63; --amber-soft: #362D1A;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  header.top { padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px 12px; background: var(--bg-alt); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .brand h1 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -0.2px; }
  .brand .date { font-family: var(--font-num); font-size: 12.5px; color: var(--ink-soft); }
  .sync-badge { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
  .sync-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-soft); }
  .sync-badge.synced .dot { background: var(--ok); }
  .sync-badge.synced { color: var(--ok); }
  .sync-badge.local .dot { background: var(--amber); }
  .sync-badge.local { color: var(--amber); }
  nav.tabs { display: flex; gap: 6px; margin-top: 10px; background: var(--surface-2); border-radius: 999px; padding: 4px; border: 1px solid var(--line); }
  nav.tabs button { flex: 1; border: none; background: transparent; color: var(--ink-soft); font-family: var(--font-ui); font-weight: 600; font-size: 13.5px; padding: 9px 4px; border-radius: 999px; cursor: pointer; }
  nav.tabs button.active { background: var(--ink); color: var(--surface); }
  main { flex: 1; padding: 16px 16px calc(120px + env(safe-area-inset-bottom, 0px)); max-width: 560px; width: 100%; margin: 0 auto; overflow-x: hidden; }
  .view { display: none; }
  .view.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .note-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .note-row:last-child { border-bottom: none; }
  .note-chip { flex-shrink: 0; width: 46px; height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: var(--font-num); font-weight: 700; font-size: 12px; color: #fff; position: relative; overflow: hidden; }
  .note-chip::after { content: ""; position: absolute; inset: 3px; border: 1px dashed rgba(255,255,255,0.55); border-radius: 3px; }
  .note-label { flex: 1; font-size: 14.5px; color: var(--ink-soft); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 17px; font-weight: 600; line-height: 1; cursor: pointer; }
  .stepper button:active { background: var(--accent-soft); }
  .stepper .count { min-width: 22px; text-align: center; font-family: var(--font-num); font-weight: 700; font-size: 15px; }
  .note-sub { width: 62px; text-align: right; font-family: var(--font-num); font-size: 13px; color: var(--ink-soft); }
  .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px dashed var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .bottom-bar .inner { max-width: 560px; margin: 0 auto; }
  .bottom-total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .bottom-total .lbl { font-size: 13px; color: var(--ink-soft); }
  .bottom-total .val { font-family: var(--font-num); font-size: 24px; font-weight: 700; }
  .btn-primary { width: 100%; border: none; background: var(--accent); color: #fff; font-family: var(--font-ui); font-weight: 700; font-size: 15px; padding: 14px; border-radius: 12px; cursor: pointer; }
  .btn-primary:disabled { opacity: 0.45; }
  .btn-secondary { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-family: var(--font-ui); font-weight: 600; font-size: 13.5px; padding: 10px 14px; border-radius: 10px; cursor: pointer; }
  .btn-danger { border: 1px solid var(--danger); background: transparent; color: var(--danger); font-family: var(--font-ui); font-weight: 600; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .register { text-align: center; padding: 18px 10px 8px; }
  .register .lbl { font-size: 12.5px; color: var(--ink-soft); }
  .register .val { font-family: var(--font-num); font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
  .register .reg-breakdown { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .pill { font-family: var(--font-num); font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .pill-temp { background: var(--amber-soft); color: var(--amber); }
  .pill-final { background: var(--ok-soft); color: var(--ok); }
  .withdrawal.is-final .amount { color: var(--ok); }
  .withdrawal { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .withdrawal:last-child { border-bottom: none; }
  .withdrawal .time { font-family: var(--font-num); font-size: 13px; color: var(--ink-soft); width: 46px; }
  .withdrawal .breakdown { flex: 1; font-size: 12px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .withdrawal .amount { font-family: var(--font-num); font-weight: 700; font-size: 14.5px; white-space: nowrap; }
  .empty { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 22px 10px; }
  .expected-row { display: flex; align-items: center; gap: 10px; }
  .expected-row label { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
  .expected-row input { width: 110px; font-family: var(--font-num); font-size: 15px; padding: 8px 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); text-align: right; }
  .delta-line { margin-top: 12px; padding: 10px 12px; border-radius: 10px; display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; }
  .delta-line.ok { background: var(--ok-soft); color: var(--ok); }
  .delta-line.bad { background: var(--danger-soft); color: var(--danger); }
  .delta-line .val { font-family: var(--font-num); }
  .period-switch { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .period-switch .nav-btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); width: 34px; height: 34px; border-radius: 9px; font-size: 16px; cursor: pointer; }
  .period-switch .label { font-weight: 700; font-size: 14.5px; text-align: center; flex: 1; }
  .gran-switch { display: flex; gap: 6px; margin-top: 10px; }
  .gran-switch button { flex: 1; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft); font-family: var(--font-ui); font-weight: 600; font-size: 12.5px; padding: 7px; border-radius: 9px; cursor: pointer; }
  .gran-switch button.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .summary-grid { display: flex; gap: 10px; margin-top: 4px; }
  .summary-grid .box { flex: 1; text-align: center; padding: 10px 4px; }
  .summary-grid .box .lbl { font-size: 11.5px; color: var(--ink-soft); }
  .summary-grid .box .val { font-family: var(--font-num); font-size: 17px; font-weight: 700; margin-top: 2px; }
  .hist-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hist-row:last-child { border-bottom: none; }
  .hist-row .top-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .hist-row .top-line .name { color: var(--ink-soft); }
  .hist-row .top-line .amt { font-family: var(--font-num); font-weight: 700; }
  .bars { display: flex; flex-direction: column; gap: 3px; }
  .bar-track { background: var(--surface-2); border-radius: 4px; height: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-fill.counted { background: var(--accent); }
  .bar-fill.expected { background: var(--ink-soft); opacity: 0.5; }
  .settings-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft); font-family: var(--font-ui); font-size: 12.5px; font-weight: 600; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .row-flex { display: flex; gap: 8px; flex-wrap: wrap; }
  .toast { position: fixed; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(10px); background: var(--ink); color: var(--surface); font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; max-width: 88vw; text-align: center; z-index: 20; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  h2.section-title { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin: 4px 0 8px; }
  .note-small { font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; }
  .hist-row.clickable { cursor: pointer; }
  .hist-row.clickable:active { background: var(--surface-2); }
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 30;
    padding: 20px 14px calc(20px + env(safe-area-inset-bottom, 0px));
    align-items: flex-end;
  }
  .modal-backdrop.show { display: flex; }
  .modal-card {
    background: var(--surface);
    border-radius: 18px 18px 14px 14px;
    padding: 16px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    max-height: 85vh;
    overflow-y: auto;
    border: 1px solid var(--line);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .modal-title { font-weight: 800; font-size: 15.5px; }
  .modal-close { border: none; background: var(--surface-2); color: var(--ink-soft); width: 30px; height: 30px; border-radius: 9px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Conta Banconote</h1>
    <div class="date" id="todayLabel"></div>
  </div>
  <div class="sync-badge" id="syncBadge"><span class="dot"></span><span id="syncBadgeText">Connessione…</span></div>
  <nav class="tabs">
    <button data-view="prelievo" class="active">Prelievo</button>
    <button data-view="oggi">Oggi</button>
    <button data-view="storico">Storico</button>
  </nav>
</header>

<main>

  <section class="view active" id="view-prelievo">
    <div class="card" id="noteRows"></div>
  </section>

  <section class="view" id="view-oggi">
    <div class="card register">
      <div class="lbl">Totale contato oggi</div>
      <div class="val" id="dayTotalVal">€ 0,00</div>
      <div class="reg-breakdown" id="regBreakdown"></div>
    </div>
    <div class="card">
      <div class="section-head">
        <h2 class="section-title" style="margin:0;">Provvisori — da confermare</h2>
        <span class="pill pill-temp" id="tempCount">0</span>
      </div>
      <div id="withdrawalsTempList"></div>
      <button class="btn-primary" id="finalizeBtn" style="margin-top:12px;" disabled>Registra tutto in modo definitivo</button>
    </div>
    <div class="card">
      <div class="section-head">
        <h2 class="section-title" style="margin:0;">Definitivi</h2>
        <span class="pill pill-final" id="finalCount">0</span>
      </div>
      <div id="withdrawalsFinalList"></div>
    </div>
    <div class="card">
      <div class="expected-row">
        <label for="expectedInput">Incasso atteso di oggi</label>
        <input type="number" id="expectedInput" inputmode="decimal" placeholder="0,00">
      </div>
      <div id="deltaBox"></div>
    </div>
  </section>

  <section class="view" id="view-storico">
    <div class="card">
      <div class="gran-switch">
        <button data-gran="week" class="active">Settimana</button>
        <button data-gran="month">Mese</button>
        <button data-gran="year">Anno</button>
      </div>
      <div class="period-switch" style="margin-top:12px;">
        <button class="nav-btn" id="periodPrev">‹</button>
        <div class="label" id="periodLabel"></div>
        <button class="nav-btn" id="periodNext">›</button>
      </div>
      <div class="summary-grid">
        <div class="box"><div class="lbl">Contato</div><div class="val" id="sumCounted">€0</div></div>
        <div class="box"><div class="lbl">Atteso</div><div class="val" id="sumExpected">€0</div></div>
        <div class="box"><div class="lbl">Differenza</div><div class="val" id="sumDelta">€0</div></div>
      </div>
    </div>
    <div class="card" id="histCard">
      <div class="note-small" id="histHint">Tocca un giorno per correggerne i prelievi.</div>
      <div id="histList"></div>
    </div>
    <div class="card">
      <h2 class="section-title">Dati</h2>
      <div class="row-flex">
        <button class="settings-btn" id="exportBtn">⬇ Esporta backup</button>
        <button class="settings-btn" id="importBtn">⬆ Importa backup</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
      <div class="note-small" id="syncNote"></div>
    </div>
  </section>

  <div class="modal-backdrop" id="dayModalBackdrop">
    <div class="modal-card">
      <div class="modal-head">
        <div class="modal-title" id="ddTitle">Giorno</div>
        <button class="modal-close" id="ddClose">✕</button>
      </div>
      <div class="register" style="padding-top:6px;">
        <div class="lbl">Totale contato</div>
        <div class="val" id="ddTotal">€ 0,00</div>
        <div class="reg-breakdown" id="ddBreakdown"></div>
      </div>
      <div class="section-head"><h2 class="section-title" style="margin:0;">Provvisori</h2><span class="pill pill-temp" id="ddTempCount">0</span></div>
      <div id="ddTempList"></div>
      <button class="btn-primary" id="ddFinalizeBtn" style="margin-top:10px;" disabled>Registra tutto in modo definitivo</button>
      <div class="section-head" style="margin-top:16px;"><h2 class="section-title" style="margin:0;">Definitivi</h2><span class="pill pill-final" id="ddFinalCount">0</span></div>
      <div id="ddFinalList"></div>
      <div class="expected-row" style="margin-top:14px;">
        <label for="ddExpectedInput">Incasso atteso</label>
        <input type="number" id="ddExpectedInput" inputmode="decimal" placeholder="0,00">
      </div>
      <div id="ddDeltaBox"></div>
    </div>
  </div>

</main>

<div class="bottom-bar" id="prelievoBar">
  <div class="inner">
    <div class="bottom-total"><span class="lbl">Totale prelievo</span><span class="val" id="prelievoTotal">€ 0,00</span></div>
    <button class="btn-primary" id="registerBtn" disabled>Registra provvisoriamente</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var DENOMS = [
    { v: 5,  color: "#8C8C8C" },
    { v: 10, color: "#C8543D" },
    { v: 20, color: "#1F5FA8" },
    { v: 50, color: "#D98A1E" }
  ];
  var STORAGE_KEY = "orsetto_conta_banconote_v1";
  var fmt = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });
  function fmtCompact(n) { return fmt.format(n || 0); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function timeKey(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function todayKey() { return dateKey(new Date()); }

  // ---------- sync layer ----------
  var dbApi = null;
  var localMode = false;
  var todayCache = { entries: [], expected: null };
  var unsubscribeToday = null;

  var syncBadge = document.getElementById("syncBadge");
  var syncBadgeText = document.getElementById("syncBadgeText");
  var syncNote = document.getElementById("syncNote");
  function setBadge(state) {
    syncBadge.className = "sync-badge " + state;
    if (state === "synced") {
      syncBadgeText.textContent = "Sincronizzato tra i tuoi iPhone";
      syncNote.textContent = "I dati sono salvati automaticamente e condivisi in tempo reale tra tutti gli iPhone su cui apri questo link, restando comunque un'app separata dal sito della lavanderia.";
    } else if (state === "local") {
      syncBadgeText.textContent = "Solo su questo telefono";
      syncNote.textContent = "La sincronizzazione non è disponibile in questa sessione: i dati restano salvati solo su questo telefono. Usa Esporta/Importa backup per spostarli su un altro dispositivo.";
    } else {
      syncBadgeText.textContent = "Connessione…";
      syncNote.textContent = "";
    }
  }

  function localLoadAll() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { return {}; }
  }
  function localSaveAll(obj) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; }
  }

  async function writeDay(key, entries, expected) {
    if (dbApi) {
      try {
        await dbApi.collection("days").doc(key).set({ date: key, entries: entries, expected: expected });
        return true;
      } catch (e) {
        console.error("db write error", e);
        showToast("Errore di sincronizzazione — riprova");
        return false;
      }
    } else {
      var all = localLoadAll();
      all[key] = { date: key, entries: entries, expected: expected };
      var ok = localSaveAll(all);
      if (key === todayKey()) {
        todayCache = all[key];
        renderOggiFromCache();
      }
      return ok;
    }
  }
  function writeToday(entries, expected) {
    return writeDay(todayKey(), entries, expected);
  }

  async function fetchRange(startKey, endKey) {
    if (dbApi) {
      try {
        var snap = await dbApi.collection("days")
          .where("date", ">=", startKey)
          .where("date", "<=", endKey)
          .orderBy("date")
          .limit(400)
          .get();
        var map = {};
        snap.docs.forEach(function (d) { map[d.id] = d.data(); });
        return map;
      } catch (e) {
        console.error("db range query error", e);
        showToast("Errore nel caricamento dello storico");
        return {};
      }
    } else {
      var all = localLoadAll();
      var out = {};
      Object.keys(all).forEach(function (k) { if (k >= startKey && k <= endKey) out[k] = all[k]; });
      return out;
    }
  }

  function startTodaySync() {
    unsubscribeToday = dbApi.collection("days").doc(todayKey()).onSnapshot(function (snap) {
      var d = snap.exists ? snap.data() : { entries: [], expected: null };
      if (!d.entries) d.entries = [];
      todayCache = d;
      renderOggiFromCache();
    }, function (err) {
      console.error("today sync error", err);
      showToast("Sincronizzazione interrotta su questo telefono");
    });
  }

  async function initSync() {
    try {
      dbApi = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("db") : null;
    } catch (e) {
      dbApi = null;
    }
    if (dbApi) {
      localMode = false;
      setBadge("synced");
      startTodaySync();
    } else {
      localMode = true;
      setBadge("local");
      var all = localLoadAll();
      todayCache = all[todayKey()] || { entries: [], expected: null };
      renderOggiFromCache();
    }
  }

  // ---------- toast ----------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  // ---------- tabs ----------
  var tabButtons = document.querySelectorAll("nav.tabs button");
  var views = document.querySelectorAll(".view");
  var prelievoBar = document.getElementById("prelievoBar");
  function switchView(name) {
    tabButtons.forEach(function (b) { b.classList.toggle("active", b.dataset.view === name); });
    views.forEach(function (v) { v.classList.toggle("active", v.id === "view-" + name); });
    prelievoBar.style.display = name === "prelievo" ? "block" : "none";
    if (name === "oggi") renderOggiFromCache();
    if (name === "storico") renderStorico();
  }
  tabButtons.forEach(function (b) { b.addEventListener("click", function () { switchView(b.dataset.view); }); });

  // ---------- PRELIEVO ----------
  var counts = {};
  DENOMS.forEach(function (d) { counts[d.v] = 0; });
  var noteRows = document.getElementById("noteRows");
  DENOMS.forEach(function (d) {
    var row = document.createElement("div");
    row.className = "note-row";
    row.innerHTML =
      '<div class="note-chip" style="background:' + d.color + '">€' + d.v + '</div>' +
      '<div class="note-label">banconote da €' + d.v + '</div>' +
      '<div class="stepper">' +
        '<button type="button" data-act="minus" data-v="' + d.v + '">−</button>' +
        '<span class="count" id="count-' + d.v + '">0</span>' +
        '<button type="button" data-act="plus" data-v="' + d.v + '">+</button>' +
      '</div>' +
      '<div class="note-sub" id="sub-' + d.v + '">€ 0</div>';
    noteRows.appendChild(row);
  });
  noteRows.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var v = parseInt(btn.dataset.v, 10);
    if (btn.dataset.act === "plus") counts[v]++; else counts[v] = Math.max(0, counts[v] - 1);
    document.getElementById("count-" + v).textContent = counts[v];
    document.getElementById("sub-" + v).textContent = fmtCompact(counts[v] * v);
    updatePrelievoTotal();
  });
  function currentPrelievoTotal() {
    var t = 0;
    DENOMS.forEach(function (d) { t += counts[d.v] * d.v; });
    return t;
  }
  var prelievoTotalEl = document.getElementById("prelievoTotal");
  var registerBtn = document.getElementById("registerBtn");
  function updatePrelievoTotal() {
    var t = currentPrelievoTotal();
    prelievoTotalEl.textContent = fmtCompact(t);
    registerBtn.disabled = t <= 0;
  }
  registerBtn.addEventListener("click", async function () {
    var t = currentPrelievoTotal();
    if (t <= 0) return;
    registerBtn.disabled = true;
    var now = new Date();
    var denomBreakdown = {};
    DENOMS.forEach(function (d) { if (counts[d.v] > 0) denomBreakdown[d.v] = counts[d.v]; });
    var entry = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), time: timeKey(now), denoms: denomBreakdown, total: t, status: "temp" };
    var newEntries = (todayCache.entries || []).concat([entry]);
    var ok = await writeToday(newEntries, todayCache.expected != null ? todayCache.expected : null);
    if (ok) {
      DENOMS.forEach(function (d) {
        counts[d.v] = 0;
        document.getElementById("count-" + d.v).textContent = "0";
        document.getElementById("sub-" + d.v).textContent = fmtCompact(0);
      });
      showToast("Prelievo provvisorio registrato — " + fmtCompact(t));
    }
    updatePrelievoTotal();
  });

  // ---------- OGGI ----------
  var dayTotalVal = document.getElementById("dayTotalVal");
  var regBreakdown = document.getElementById("regBreakdown");
  var withdrawalsTempList = document.getElementById("withdrawalsTempList");
  var withdrawalsFinalList = document.getElementById("withdrawalsFinalList");
  var tempCountEl = document.getElementById("tempCount");
  var finalCountEl = document.getElementById("finalCount");
  var finalizeBtn = document.getElementById("finalizeBtn");
  var expectedInput = document.getElementById("expectedInput");
  var deltaBox = document.getElementById("deltaBox");

  function breakdownLabel(entry) {
    var parts = [];
    Object.keys(entry.denoms || {}).sort(function (a, b) { return b - a; }).forEach(function (v) {
      parts.push(entry.denoms[v] + "×€" + v);
    });
    return parts.join(" · ") || "—";
  }

  function renderList(container, entries, emptyMsg, isFinal) {
    container.innerHTML = "";
    if (entries.length === 0) {
      container.innerHTML = '<div class="empty">' + emptyMsg + '</div>';
      return;
    }
    entries.slice().reverse().forEach(function (entry) {
      var row = document.createElement("div");
      row.className = "withdrawal" + (isFinal ? " is-final" : "");
      row.innerHTML =
        '<div class="time">' + entry.time + '</div>' +
        '<div class="breakdown">' + breakdownLabel(entry) + '</div>' +
        '<div class="amount">' + fmtCompact(entry.total) + '</div>' +
        '<button class="btn-danger" data-id="' + entry.id + '">Elimina</button>';
      container.appendChild(row);
    });
  }

  function renderOggiFromCache() {
    var entries = todayCache.entries || [];
    var tempEntries = entries.filter(function (e) { return e.status !== "final"; });
    var finalEntries = entries.filter(function (e) { return e.status === "final"; });
    var tempTotal = tempEntries.reduce(function (s, e) { return s + e.total; }, 0);
    var finalTotal = finalEntries.reduce(function (s, e) { return s + e.total; }, 0);
    var total = tempTotal + finalTotal;

    dayTotalVal.textContent = fmtCompact(total);
    regBreakdown.textContent = entries.length
      ? ("provvisorio " + fmtCompact(tempTotal) + " · definitivo " + fmtCompact(finalTotal))
      : "";

    tempCountEl.textContent = tempEntries.length;
    finalCountEl.textContent = finalEntries.length;
    finalizeBtn.disabled = tempEntries.length === 0;

    renderList(withdrawalsTempList, tempEntries, "Nessun prelievo provvisorio.", false);
    renderList(withdrawalsFinalList, finalEntries, "Nessun prelievo definitivo ancora.", true);

    if (document.activeElement !== expectedInput) {
      expectedInput.value = todayCache.expected != null ? todayCache.expected : "";
    }
    renderDelta(total, todayCache.expected != null ? todayCache.expected : null);
  }

  async function deleteEntry(id) {
    var newEntries = (todayCache.entries || []).filter(function (en) { return en.id !== id; });
    var ok = await writeToday(newEntries, todayCache.expected != null ? todayCache.expected : null);
    if (ok) showToast("Prelievo eliminato");
  }
  withdrawalsTempList.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-id]");
    if (btn) deleteEntry(btn.dataset.id);
  });
  withdrawalsFinalList.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-id]");
    if (btn) deleteEntry(btn.dataset.id);
  });

  finalizeBtn.addEventListener("click", async function () {
    var entries = todayCache.entries || [];
    var tempCount = entries.filter(function (e) { return e.status !== "final"; }).length;
    if (tempCount === 0) return;
    finalizeBtn.disabled = true;
    var newEntries = entries.map(function (e) {
      return e.status === "final" ? e : Object.assign({}, e, { status: "final" });
    });
    var ok = await writeToday(newEntries, todayCache.expected != null ? todayCache.expected : null);
    if (ok) {
      var didBackup = await exportBackup(true);
      showToast(didBackup ? "Prelievi registrati definitivamente — backup salvato" : "Prelievi registrati definitivamente");
    }
    updatePrelievoTotal();
  });

  function renderDelta(counted, expected) {
    if (expected == null || isNaN(expected)) { deltaBox.innerHTML = ""; return; }
    var delta = counted - expected;
    var cls = Math.abs(delta) < 0.01 ? "ok" : (delta < 0 ? "bad" : "ok");
    var text = Math.abs(delta) < 0.01 ? "Corrisponde all'incasso atteso" : (delta < 0 ? "Mancano" : "In più di");
    deltaBox.innerHTML = '<div class="delta-line ' + cls + '"><span>' + text + '</span><span class="val">' + fmtCompact(Math.abs(delta)) + '</span></div>';
  }

  expectedInput.addEventListener("change", async function () {
    var val = parseFloat(expectedInput.value);
    var newExpected = isNaN(val) ? null : val;
    await writeToday(todayCache.entries || [], newExpected);
  });

  // ---------- STORICO ----------
  var granularity = "week";
  var periodOffset = 0;
  document.querySelectorAll(".gran-switch button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".gran-switch button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      granularity = b.dataset.gran;
      periodOffset = 0;
      renderStorico();
    });
  });
  document.getElementById("periodPrev").addEventListener("click", function () { periodOffset--; renderStorico(); });
  document.getElementById("periodNext").addEventListener("click", function () { periodOffset++; renderStorico(); });

  function startOfWeek(d) { var r = new Date(d); var day = (r.getDay() + 6) % 7; r.setDate(r.getDate() - day); r.setHours(0,0,0,0); return r; }
  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function addMonths(d, n) { var r = new Date(d); r.setMonth(r.getMonth() + n); return r; }

  var MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  var MESI_LONG = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

  async function renderStorico() {
    document.getElementById("histHint").textContent = granularity === "year"
      ? ""
      : "Tocca un giorno per correggerne i prelievi.";
    var now = new Date();
    var periodLabel = document.getElementById("periodLabel");
    var histList = document.getElementById("histList");
    var rows = [];
    var sumCounted = 0, sumExpected = 0, anyExpected = false;

    if (granularity === "week") {
      var base = addDays(startOfWeek(now), periodOffset * 7);
      var end = addDays(base, 6);
      periodLabel.textContent = base.getDate() + " " + MESI[base.getMonth()] + " – " + end.getDate() + " " + MESI[end.getMonth()];
      var map = await fetchRange(dateKey(base), dateKey(end));
      for (var i = 0; i < 7; i++) {
        var d = addDays(base, i);
        var key = dateKey(d);
        var dayObj = map[key];
        var c = dayObj ? (dayObj.entries || []).reduce(function (s, e) { return s + e.total; }, 0) : 0;
        var exp = dayObj && dayObj.expected != null ? dayObj.expected : null;
        sumCounted += c;
        if (exp != null) { sumExpected += exp; anyExpected = true; }
        rows.push({ label: ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"][i] + " " + d.getDate(), counted: c, expected: exp, key: key });
      }
    } else if (granularity === "month") {
      var m = addMonths(new Date(now.getFullYear(), now.getMonth(), 1), periodOffset);
      periodLabel.textContent = MESI_LONG[m.getMonth()] + " " + m.getFullYear();
      var daysInMonth = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      var mStart = new Date(m.getFullYear(), m.getMonth(), 1);
      var mEnd = new Date(m.getFullYear(), m.getMonth(), daysInMonth);
      var mapM = await fetchRange(dateKey(mStart), dateKey(mEnd));
      for (var dd = 1; dd <= daysInMonth; dd++) {
        var dm = new Date(m.getFullYear(), m.getMonth(), dd);
        if (dm > now) continue;
        var keym = dateKey(dm);
        var daym = mapM[keym];
        if (!daym) continue;
        var cm = (daym.entries || []).reduce(function (s, e) { return s + e.total; }, 0);
        var expm = daym.expected != null ? daym.expected : null;
        sumCounted += cm;
        if (expm != null) { sumExpected += expm; anyExpected = true; }
        rows.push({ label: dd + " " + MESI[dm.getMonth()], counted: cm, expected: expm, key: keym });
      }
    } else {
      var y = now.getFullYear() + periodOffset;
      periodLabel.textContent = "" + y;
      var yStart = new Date(y, 0, 1), yEnd = new Date(y, 11, 31);
      var mapY = await fetchRange(dateKey(yStart), dateKey(yEnd));
      for (var mo = 0; mo < 12; mo++) {
        var mCounted = 0, mExpected = 0, mAny = false;
        var dim = new Date(y, mo + 1, 0).getDate();
        for (var day2 = 1; day2 <= dim; day2++) {
          var dObj = new Date(y, mo, day2);
          if (dObj > now) continue;
          var dd2 = mapY[dateKey(dObj)];
          if (!dd2) continue;
          mCounted += (dd2.entries || []).reduce(function (s, e) { return s + e.total; }, 0);
          if (dd2.expected != null) { mExpected += dd2.expected; mAny = true; }
        }
        if (mCounted === 0 && !mAny) continue;
        sumCounted += mCounted;
        if (mAny) { sumExpected += mExpected; anyExpected = true; }
        rows.push({ label: MESI_LONG[mo], counted: mCounted, expected: mAny ? mExpected : null });
      }
    }

    document.getElementById("sumCounted").textContent = fmtCompact(sumCounted);
    document.getElementById("sumExpected").textContent = anyExpected ? fmtCompact(sumExpected) : "—";
    document.getElementById("sumDelta").textContent = anyExpected ? fmtCompact(sumCounted - sumExpected) : "—";

    histList.innerHTML = "";
    if (!rows || rows.length === 0) {
      histList.innerHTML = '<div class="empty">Nessun dato per questo periodo.</div>';
      return;
    }
    var maxVal = Math.max.apply(null, rows.map(function (r) { return Math.max(r.counted, r.expected || 0); })) || 1;
    rows.forEach(function (r) {
      var el = document.createElement("div");
      el.className = "hist-row" + (r.key ? " clickable" : "");
      if (r.key) el.dataset.date = r.key;
      var expLine = r.expected != null
        ? '<div class="bar-track"><div class="bar-fill expected" style="width:' + (r.expected / maxVal * 100) + '%"></div></div>'
        : "";
      el.innerHTML =
        '<div class="top-line"><span class="name">' + r.label + '</span><span class="amt">' + fmtCompact(r.counted) + (r.expected != null ? ' <span style="color:var(--ink-soft);font-weight:400;">/ ' + fmtCompact(r.expected) + '</span>' : '') + '</span></div>' +
        '<div class="bars"><div class="bar-track"><div class="bar-fill counted" style="width:' + (r.counted / maxVal * 100) + '%"></div></div>' + expLine + '</div>';
      histList.appendChild(el);
    });
  }
  document.getElementById("histList").addEventListener("click", function (e) {
    var row = e.target.closest(".hist-row[data-date]");
    if (row) openDayDetail(row.dataset.date);
  });

  // ---------- day detail (correzioni su giorni passati) ----------
  var dayDetailKey = null;
  var dayDetailData = { entries: [], expected: null };
  var ddModal = document.getElementById("dayModalBackdrop");
  var ddTitle = document.getElementById("ddTitle");
  var ddTotal = document.getElementById("ddTotal");
  var ddBreakdown = document.getElementById("ddBreakdown");
  var ddTempList = document.getElementById("ddTempList");
  var ddFinalList = document.getElementById("ddFinalList");
  var ddTempCount = document.getElementById("ddTempCount");
  var ddFinalCount = document.getElementById("ddFinalCount");
  var ddFinalizeBtn = document.getElementById("ddFinalizeBtn");
  var ddExpectedInput = document.getElementById("ddExpectedInput");
  var ddDeltaBox = document.getElementById("ddDeltaBox");

  var GIORNI = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
  function formatDayTitle(key) {
    var parts = key.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return GIORNI[d.getDay()] + " " + d.getDate() + " " + MESI[d.getMonth()] + " " + d.getFullYear();
  }

  async function openDayDetail(key) {
    dayDetailKey = key;
    ddTitle.textContent = formatDayTitle(key);
    var map = await fetchRange(key, key);
    dayDetailData = map[key] || { entries: [], expected: null };
    if (!dayDetailData.entries) dayDetailData.entries = [];
    renderDayDetail();
    ddModal.classList.add("show");
  }
  function closeDayDetail() {
    ddModal.classList.remove("show");
    dayDetailKey = null;
  }
  document.getElementById("ddClose").addEventListener("click", closeDayDetail);
  ddModal.addEventListener("click", function (e) { if (e.target === ddModal) closeDayDetail(); });

  function renderDayDetail() {
    var entries = dayDetailData.entries || [];
    var tempEntries = entries.filter(function (e) { return e.status !== "final"; });
    var finalEntries = entries.filter(function (e) { return e.status === "final"; });
    var tempTotal = tempEntries.reduce(function (s, e) { return s + e.total; }, 0);
    var finalTotal = finalEntries.reduce(function (s, e) { return s + e.total; }, 0);
    var total = tempTotal + finalTotal;

    ddTotal.textContent = fmtCompact(total);
    ddBreakdown.textContent = entries.length ? ("provvisorio " + fmtCompact(tempTotal) + " · definitivo " + fmtCompact(finalTotal)) : "";
    ddTempCount.textContent = tempEntries.length;
    ddFinalCount.textContent = finalEntries.length;
    ddFinalizeBtn.disabled = tempEntries.length === 0;

    renderList(ddTempList, tempEntries, "Nessun prelievo provvisorio.", false);
    renderList(ddFinalList, finalEntries, "Nessun prelievo definitivo.", true);

    if (document.activeElement !== ddExpectedInput) {
      ddExpectedInput.value = dayDetailData.expected != null ? dayDetailData.expected : "";
    }
    if (dayDetailData.expected == null || isNaN(dayDetailData.expected)) {
      ddDeltaBox.innerHTML = "";
    } else {
      var delta = total - dayDetailData.expected;
      var cls = Math.abs(delta) < 0.01 ? "ok" : (delta < 0 ? "bad" : "ok");
      var text = Math.abs(delta) < 0.01 ? "Corrisponde all'incasso atteso" : (delta < 0 ? "Mancano" : "In più di");
      ddDeltaBox.innerHTML = '<div class="delta-line ' + cls + '"><span>' + text + '</span><span class="val">' + fmtCompact(Math.abs(delta)) + '</span></div>';
    }
  }

  async function ddPersist() {
    var ok = await writeDay(dayDetailKey, dayDetailData.entries, dayDetailData.expected);
    if (ok) { renderDayDetail(); renderStorico(); }
    return ok;
  }

  function ddDeleteHandler(e) {
    var btn = e.target.closest("button[data-id]");
    if (!btn) return;
    dayDetailData.entries = (dayDetailData.entries || []).filter(function (en) { return en.id !== btn.dataset.id; });
    ddPersist().then(function (ok) { if (ok) showToast("Prelievo eliminato"); });
  }
  ddTempList.addEventListener("click", ddDeleteHandler);
  ddFinalList.addEventListener("click", ddDeleteHandler);

  ddFinalizeBtn.addEventListener("click", function () {
    dayDetailData.entries = (dayDetailData.entries || []).map(function (e) {
      return e.status === "final" ? e : Object.assign({}, e, { status: "final" });
    });
    ddPersist().then(async function (ok) {
      if (ok) {
        var didBackup = await exportBackup(true);
        showToast(didBackup ? "Prelievi registrati definitivamente — backup salvato" : "Prelievi registrati definitivamente");
      }
    });
  });

  ddExpectedInput.addEventListener("change", function () {
    var val = parseFloat(ddExpectedInput.value);
    dayDetailData.expected = isNaN(val) ? null : val;
    ddPersist();
  });

  // ---------- backup ----------
  var AUTO_BACKUP_KEY = "orsetto_conta_banconote_last_autobackup";
  async function exportBackup(auto) {
    if (auto) {
      try {
        if (localStorage.getItem(AUTO_BACKUP_KEY) === todayKey()) return false;
      } catch (e) {}
    }
    var days = {};
    if (dbApi) {
      try {
        var snap = await dbApi.collection("days").orderBy("date").limit(1000).get();
        snap.docs.forEach(function (d) { days[d.id] = d.data(); });
      } catch (e) {
        if (!auto) showToast("Errore nell'esportazione");
        return false;
      }
    } else {
      days = localLoadAll();
    }
    var blob = new Blob([JSON.stringify({ days: days }, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "conta-banconote-backup-" + todayKey() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if (auto) { try { localStorage.setItem(AUTO_BACKUP_KEY, todayKey()); } catch (e) {} }
    if (!auto) showToast("Backup esportato");
    return true;
  }
  document.getElementById("exportBtn").addEventListener("click", function () { exportBackup(false); });

  var importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", function () { importFile.click(); });
  importFile.addEventListener("change", function () {
    var file = importFile.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = async function () {
      try {
        var imported = JSON.parse(reader.result);
        if (!imported || typeof imported !== "object" || !imported.days) throw new Error("formato non valido");
        if (dbApi) {
          var keys = Object.keys(imported.days);
          for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            var body = imported.days[k];
            body.date = k;
            await dbApi.collection("days").doc(k).set(body);
          }
        } else {
          localSaveAll(imported.days);
          todayCache = imported.days[todayKey()] || { entries: [], expected: null };
        }
        renderOggiFromCache();
        renderStorico();
        showToast("Backup importato");
      } catch (e) {
        console.error(e);
        showToast("File non valido");
      }
    };
    reader.readAsText(file);
    importFile.value = "";
  });

  // ---------- init ----------
  document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });
  updatePrelievoTotal();
  initSync();
})();
</script>
</body>
</html>
